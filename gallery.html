<!DOCTYPE html>
<html lang="en-BD">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery</title>
  <meta name="description" content="Photo gallery of our weddings, corporate events, concerts, private parties and décor set-ups.">
  <meta name="theme-color" content="#15110e">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="gallery">
<div id="site-header"></div>

<main id="main">
  <section class="page-hero" data-render="page-hero" data-img="fairyLights">
    <div class="page-hero__bg"></div>
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span aria-current="page">Gallery</span></nav>
      <span class="eyebrow">Gallery</span>
      <h1>Moments, <span class="display-em">captured.</span></h1>
      <p>A glimpse of the weddings, stages, tables and crowds we've had the joy of creating. Tap any photo to view it full-screen.</p>
    </div>
  </section>

  <section class="section" data-render="gallery">
    <div class="container">
      <div class="chips center" aria-label="Filter gallery"></div>
      <div class="masonry"></div>
    </div>
  </section>

  <section class="section section--sand section--tight">
    <div class="container center">
      <span class="eyebrow">Follow along</span>
      <h2>See more on <span class="display-em">Instagram</span></h2>
      <p class="muted">Daily behind-the-scenes, reels and real-time event stories.</p>
    </div>
  </section>
  <section><div class="insta-strip" data-render="insta"></div></section>
</main>

<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
